[package]
name = "wt-loadgen"
version = "0.1.0"
description = "Tracker-shaped WebSocket load generator and smoke check for wt-tracker servers (JS and Rust)"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
flate2 = { version = "1.1", default-features = false, features = ["zlib-rs"] }
futures-util = "0.3"
hdrhistogram = "7.5"
rcgen = "0.14"
serde_json = "1.0"
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "macros", "sync", "io-util"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
