[workspace]
resolver = "3"
members = ["crates/wt-core", "crates/wt-proto", "crates/wt-server", "crates/wt-bench", "crates/wt-difftest", "crates/wt-loadgen"]

[workspace.package]
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
debug = "line-tables-only"

[profile.test]
opt-level = 1
