# The finish checklist of AGENTS.md on every pull request and every push to main, a short fuzzing
# run of every fuzz target, plus the Autobahn conformance suite on pushes to main. Nightly
# (03:00 UTC): everything again, with 20 minutes of fuzzing per target.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # The JS tracker the differential test compares against (github.com/Novage/wt-tracker).
  WT_TRACKER_REF: 8ad751c7dae5fffe5b7a671796e18c507282fd25

jobs:
  check:
    name: fmt, clippy, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Toolchain from rust-toolchain.toml; caches cargo and target/.
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  spec:
    name: spec updated with code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # A pull request labelled `spec-unchanged-ok` may change code without docs/SPEC.md
      # (a pure refactor, a dependency bump; see AGENTS.md).
      - name: scripts/check-spec.sh
        env:
          SPEC_UNCHANGED_OK: ${{ contains(github.event.pull_request.labels.*.name, 'spec-unchanged-ok') && '1' || '' }}
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
        run: |
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            echo "no base to compare with"; exit 0
          fi
          scripts/check-spec.sh "$BASE"

  difftest:
    name: JS vs Rust differential test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: wt-tracker-rust
      - uses: actions/checkout@v4
        with:
          repository: Novage/wt-tracker
          ref: ${{ env.WT_TRACKER_REF }}
          path: wt-tracker
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - run: npm ci
        working-directory: wt-tracker
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache-workspaces: wt-tracker-rust
          rust-src-dir: wt-tracker-rust
      - run: node difftest/run.ts
        working-directory: wt-tracker-rust

  fuzz:
    name: fuzz ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [ws_frames, deflate_roundtrip, http_upgrade, protocol]
    steps:
      - uses: actions/checkout@v4
      # cargo-fuzz (libFuzzer coverage instrumentation) needs a nightly compiler.
      - uses: dtolnay/rust-toolchain@nightly
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      # The corpus found by earlier runs (the committed seeds are always there).
      - uses: actions/cache@v4
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-${{ matrix.target }}-
      - name: cargo fuzz run
        env:
          SECONDS_PER_TARGET: ${{ github.event_name == 'schedule' && 1200 || 60 }}
        # --target: the prebuilt cargo-fuzz is a musl binary and would default to musl, where
        # AddressSanitizer is not available.
        run: >-
          cargo +nightly fuzz run --target x86_64-unknown-linux-gnu ${{ matrix.target }}
          -- -max_total_time=$SECONDS_PER_TARGET -timeout=10 -rss_limit_mb=4096
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crash-${{ matrix.target }}
          path: fuzz/artifacts

  autobahn:
    name: Autobahn testsuite
    if: github.event_name != 'pull_request'
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - run: loadtest/autobahn.sh
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autobahn-reports
          path: target/autobahn
